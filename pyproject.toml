[project]
name = "pytest-anki"
version = "1.0.0-beta.7"
description = "A pytest plugin for testing Anki add-ons"
authors = [
    { name = "Aristotelis P. (Glutanimate)" },
    { name = "Michal Krassowski" },
]
requires-python = "~=3.8"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = [
    "anki",
    "development",
    "testing",
    "test",
    "pytest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: User Interfaces",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
]
dependencies = [
    "pytest>=3.5.0",
    "pytest-forked>=1.3.0,<2",
    "pytest-xdist>=2.3.0,<3",
    "pytest-xvfb>=2.0.0,<3",
    "pytest-qt>=4.0.2,<5",
    "selenium>=3.141.0,<4",
    "packaging~=21.3",
    "aqt>=2.1.28",
    "anki>=2.1.28",
]

[project.urls]
Homepage = "https://github.com/glutanimate/pytest-anki"
Repository = "https://github.com/glutanimate/pytest-anki"

[project.entry-points.pytest11]
anki = "pytest_anki.plugin"

[dependency-groups]
dev = [
    "black~=21.7b0",
    "pylint>=2.10.2,<3",
    "mypy>=0.910,<0.911",
    "isort>=5.9.3,<6",
    "flake8>=3.9.2,<4",
    "requests>=2.26.0,<3",
    "types-requests>=2.25.6,<3",
    "autoflake~=1.4",
]
qt5 = [
    "PyQt5>=5.14.1,<6",
    "PyQtWebEngine>=5.14.0,<6",
    "PyQt5-stubs>=5.15.6,<6",
]
qt6 = [
    "PyQt6~=6.2",
    "PyQt6-WebEngine~=6.2",
]

[tool.uv]
default-groups = [
    "dev",
    "qt5",
    "qt6",
]

[tool.hatch.build.targets.sdist]
include = [
    "pytest_anki/py.typed",
    "pytest_anki/anki-current.json",
]

[tool.hatch.build.targets.wheel]
include = [
    "pytest_anki/py.typed",
    "pytest_anki/anki-current.json",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
qt_api = "pyqt5"

[tool.mypy]
show_error_codes = true
ignore_missing_imports = true
follow_imports = "silent"
show_column_numbers = true
exclude = "tests/samples/"

[tool.black]
exclude = "tests/samples/"
experimental-string-processing = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 88
ensure_newline_before_comments = true
skip_glob = "tests/samples/**"
