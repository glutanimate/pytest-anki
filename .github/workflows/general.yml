name: tests

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/dependabot.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/dependabot.yml"

jobs:
  test-anki-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Selenium Manager fetches the chromedriver matching each Qt's
        # Chromium at test time, so the matrix carries no driver version
        include:
          - anki: anki-2154
            python: 3.9.15
            qt: qt6-2154
          - anki: anki-2156
            python: 3.9.15
            qt: qt6-2156
          - anki: anki-2165
            python: 3.9.15
            qt: qt6-2165
          - anki: anki-2312
            python: 3.9.15
            qt: qt6-2312
          - anki: anki-2411
            python: 3.9.18
            qt: qt6-2411
          - anki: anki-2502
            python: 3.9.18
            qt: qt6-2502

    steps:
      - name: Checkout pytest-anki
        uses: actions/checkout@v2

      - name: Set up test environment
        uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}
          anki: ${{ matrix.anki }}
          qt: ${{ matrix.qt }}

      - name: Run tests for Anki ${{ matrix.anki }}
        shell: bash
        run: |
          make test
